name: Bug report
description: Report a reproducible mAuth problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    attributes:
      label: mAuth version
    validations:
      required: true
  - type: input
    attributes:
      label: Server and Java version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps and logs
    validations:
      required: true
