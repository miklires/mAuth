name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build :api:build :discord:build :velocity:build :telegram:build --no-daemon
      - name: Update Modrinth project page
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          sed 's#](docs/assets/web-panel.png)#](https://raw.githubusercontent.com/miklires/mAuth/main/docs/assets/web-panel.png)#' README.md > modrinth-body.md
          jq -n --rawfile body modrinth-body.md '{
            title: "mAuth",
            description: "Secure account authentication for Paper, Purpur, Folia, and Velocity networks.",
            body: $body,
            categories: ["management", "utility"],
            additional_categories: ["social"],
            source_url: "https://github.com/miklires/mAuth",
            issues_url: "https://github.com/miklires/mAuth/issues",
            license_id: "MIT"
          }' > modrinth-project.json
          curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @modrinth-project.json \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID"
      - name: Check existing Modrinth versions
        id: modrinth_versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          curl --fail-with-body \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version" \
            > modrinth-versions.json
          echo "core_exists=$(jq --arg version "$VERSION" 'any(.version_number == $version)' modrinth-versions.json)" >> "$GITHUB_OUTPUT"
          echo "velocity_exists=$(jq --arg version "$VERSION-velocity" 'any(.version_number == $version)' modrinth-versions.json)" >> "$GITHUB_OUTPUT"
      - name: Publish Paper version to Modrinth
        if: steps.modrinth_versions.outputs.core_exists != 'true'
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      - name: Publish Velocity version to Modrinth
        if: steps.modrinth_versions.outputs.velocity_exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          jq -n \
            --arg name "mAuth Velocity $VERSION" \
            --arg version "$VERSION-velocity" \
            --arg project "$MODRINTH_PROJECT_ID" \
            --rawfile changelog CHANGELOG.md \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: ["26.2"],
              version_type: "release",
              loaders: ["velocity"],
              featured: true,
              status: "listed",
              project_id: $project,
              file_parts: ["velocity"],
              primary_file: "velocity"
            }' > modrinth-velocity.json
          curl --fail-with-body --request POST \
            --header "Authorization: $MODRINTH_TOKEN" \
            --form "data=@modrinth-velocity.json;type=application/json" \
            --form "velocity=@velocity/build/libs/mAuth-Velocity-$VERSION.jar;type=application/java-archive" \
            "https://api.modrinth.com/v2/version"
      - name: Submit Modrinth project for review
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"requested_status":"approved"}' \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            build/libs/mAuth-1.0.1.jar
            api/build/libs/mAuth-API-1.0.1.jar
            discord/build/libs/mAuth-Discord-1.0.1.jar
            velocity/build/libs/mAuth-Velocity-1.0.1.jar
            telegram/build/libs/mAuth-Telegram-1.0.1.jar
