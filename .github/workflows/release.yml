name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build :api:build :discord:build :velocity:build :bungee:build :telegram:build --no-daemon
      - run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/mAuth-*.jar
            api/build/libs/*.jar
            discord/build/libs/*.jar
            velocity/build/libs/*.jar
            bungee/build/libs/*.jar
            telegram/build/libs/*.jar
