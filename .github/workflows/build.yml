name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build :api:build :discord:build :velocity:build :telegram:build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: mauth-${{ github.sha }}
          path: |
            build/libs/mAuth-1.0.1.jar
            api/build/libs/mAuth-API-1.0.1.jar
            discord/build/libs/mAuth-Discord-1.0.1.jar
            velocity/build/libs/mAuth-Velocity-1.0.1.jar
            telegram/build/libs/mAuth-Telegram-1.0.1.jar
