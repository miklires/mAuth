name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build :api:build :discord:build :velocity:build :bungee:build :telegram:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mauth-${{ github.sha }}
          path: |
            build/libs/*.jar
            api/build/libs/*.jar
            discord/build/libs/*.jar
            velocity/build/libs/*.jar
            bungee/build/libs/*.jar
            telegram/build/libs/*.jar
