config-version: 3

storage:
  # H2 works without extra setup. For MySQL/MariaDB/PostgreSQL, fill the remote
  # connection fields below and keep credentials outside public backups.
  type: h2
  file: mauth
  jdbc-url: ""
  host: localhost
  port: 3306
  name: mauth
  user: mauth
  password: ""
  pool-size: 10
  connection-timeout-millis: 10000
  max-lifetime-millis: 1800000

language:
  default: en_US
  per-player: true

discord:
  # Optional integration. Leave disabled until the bot token and IDs are set.
  mode: disabled
  required-for-new-after: 0
  token: "YOUR_BOT_TOKEN"
  bot-name: "BotName#0000"
  invite-link: "https://discord.gg/REPLACE_ME"
  server-name: "Minecraft Server"
  guild-id: ""
  player-role-id: ""
  link-code-ttl-seconds: 300
  show-ip: false

security:
  password-algorithm: argon2id
  bcrypt-cost: 12
  argon2-memory-kib: 65536
  argon2-iterations: 3
  argon2-parallelism: 1
  min-password-length: 8
  max-password-length: 64
  max-login-attempts: 5
  login-attempt-window-seconds: 300
  lockout-seconds: 600
  session-ttl-seconds: 3600
  # Never auto-login by IP after that address has been used by multiple accounts.
  block-shared-ip-sessions: true
  freeze-on-join: true
  # Set either timeout to 0 to disable it. Existing v2 configs are migrated from
  # auth-timeout-seconds without overwriting an administrator's chosen value.
  login-timeout-seconds: 60
  registration-timeout-seconds: 120
  auth-bossbar:
    enabled: true
    color: RED
    overlay: PROGRESS
  max-accounts-per-ip: 3
  enforce-username-case: true
  block-duplicate-sessions: true
  totp-issuer: "mAuth"
  data-encryption-key: ""
  auth-policy:
    new-ip: captcha
    new-device: notify
  allowed-commands:
    - register
    - reg
    - login
    - l
    - captcha
    - 2fa
    - totp
    - recover

whitelist:
  enabled: false
  kick-message: "<red>You are not whitelisted."

limbo:
  enabled: true
  hide-inventory: true
  world-name: limbo
  spawn:
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

captcha:
  mode: auto
  length: 6
  max-attempts: 3
  flood-threshold: 10
  flood-window-seconds: 60
  flood-cooldown-seconds: 300
  attack-whitelist-mode: true
  blocked-username-patterns:
    - "(?i)server"
    - "(?i)console"

audit:
  enabled: true
  retention-days: 90

geoip:
  # Requires a GeoLite2 City database file. Disabled for a clean first launch.
  enabled: false
  database: "GeoLite2-City.mmdb"
  download-on-missing: false
  download-url: ""
  notify-discord: true

floodgate:
  # Enable only when Floodgate is installed and Bedrock auto-registration is wanted.
  enabled: false
  auto-register: true

proxy:
  shared-secret: ""

vpn:
  provider: "none"
  block: true
  fail-closed: false
  cache-seconds: 3600
  http:
    url: ""
    api-key-header: "Authorization"
    api-key: ""
    boolean-field: "proxy"
    timeout-millis: 3000

web:
  # The panel has no TLS termination. Keep the loopback bind and use a reverse
  # proxy when exposing it. A random token is generated when this field is blank.
  enabled: false
  bind: "127.0.0.1"
  port: 8765
  token: ""

email:
  enabled: false
  from-address: "mauth@example.com"
  from-name: "mAuth"
  code-ttl-seconds: 600
  rate-limit-seconds: 300
  verification-subject: "mAuth email verification"
  verification-body: "Your verification code: <code>"
  recovery-subject: "mAuth password recovery"
  recovery-body: "Recovery code for <player>: <code>"
  smtp:
    host: "smtp.example.com"
    port: 587
    username: ""
    password: ""
    starttls: true
    ssl: false
    timeout-millis: 5000
    ehlo: "localhost"

telegram:
  enabled: false
  token: ""
  poll-timeout-seconds: 25

metrics:
  enabled: true
  bstats-id: 33343

updates:
  enabled: true
  modrinth-project-id: "xk0cx4UM"
  interval-hours: 24
  timeout-millis: 8000

imports:
  authme:
    jdbc-url: ""
    user: ""
    password: ""
    table: "authme"
    hash-format: "preserve"
    columns:
      username: "username"
      real-name: "realname"
      password: "password"
      ip: "ip"
      registered-at: "regdate"
  nlogin:
    jdbc-url: ""
    user: ""
    password: ""
    table: "nlogin"
    hash-format: "preserve"
    columns:
      username: "name"
      real-name: "realname"
      password: "password"
      ip: "address"
      registered-at: "regdate"
  librelogin:
    jdbc-url: ""
    user: ""
    password: ""
    table: "librelogin_user"
    hash-format: "preserve"
    columns:
      username: "last_nickname"
      real-name: "last_nickname"
      password: "password"
      ip: "ip"
      registered-at: "join_date"
  opennlogin:
    jdbc-url: ""
    user: ""
    password: ""
    table: "users"
    hash-format: "preserve"
    columns:
      username: "name"
      real-name: "name"
      password: "password"
      ip: "last_ip"
      registered-at: "registered_at"
