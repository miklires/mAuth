name: mAuth
version: ${version}
main: io.github.miklires.mauth.MAuth
api-version: '26.2'
author: miklires
description: Account authentication for offline-mode and mixed-mode servers
load: STARTUP
folia-supported: true
softdepend: [floodgate, PlaceholderAPI]
libraries:
  - com.zaxxer:HikariCP:6.2.1
  - com.h2database:h2:2.3.232
  - org.xerial:sqlite-jdbc:3.47.1.0
  - com.mysql:mysql-connector-j:9.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.1
  - org.postgresql:postgresql:42.7.5
  - com.maxmind.geoip2:geoip2:5.2.0

permissions:
  mauth.command.register:
    description: Use /register
    default: true
  mauth.command.login:
    description: Use /login
    default: true
  mauth.command.captcha:
    description: Use /captcha
    default: true
  mauth.command.logout:
    description: Use /logout
    default: true
  mauth.command.changepassword:
    description: Use /changepassword
    default: true
  mauth.command.license:
    description: Use /license
    default: true
  mauth.command.cracked:
    description: Use /cracked
    default: true
  mauth.command.2fa:
    description: Use TOTP two-factor authentication
    default: true
  mauth.command.sessions:
    description: Use the session management GUI
    default: true
  mauth.command.email:
    description: Manage a recovery email address
    default: true
  mauth.command.recover:
    description: Recover an account through verified email
    default: true
  mauth.command.telegram:
    description: Link a Telegram account
    default: true
  mauth.command.whitelist.add:
    description: Use /whitelist add
    default: op
  mauth.command.whitelist.remove:
    description: Use /whitelist remove
    default: op
  mauth.command.whitelist.list:
    description: Use /whitelist list
    default: op
  mauth.command.reset:
    description: Use /mauthreset
    default: op
  mauth.command.unlink:
    description: Use /mauthunlink
    default: op
  mauth.command.log:
    description: Use /mauthlog
    default: op
  mauth.command.ip:
    description: View full player IP addresses
    default: op
  mauth.command.forcelogin:
    description: Force an online player to authenticate
    default: op
  mauth.command.import:
    description: Import accounts from another authentication plugin
    default: op
  mauth.command.lock:
    description: Temporarily lock or unlock accounts
    default: op
  mauth.command.discordhistory:
    description: View Discord link history
    default: op
  mauth.admin:
    description: All admin permissions
    default: op
    children:
      mauth.command.whitelist.add: true
      mauth.command.whitelist.remove: true
      mauth.command.whitelist.list: true
      mauth.command.reset: true
      mauth.command.unlink: true
      mauth.command.log: true
      mauth.command.ip: true
      mauth.command.forcelogin: true
      mauth.command.import: true
      mauth.command.lock: true
      mauth.command.discordhistory: true
